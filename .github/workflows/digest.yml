name: ai-news-digest

on:
  schedule:
    - cron: '0 1,9,17 * * *'   # UTC时间，对应北京时间 9:00 / 17:00 / 次日 1:00
  workflow_dispatch:          # 允许你在网页上手动点击运行
  push:
    branches: [main]
    paths: ['config/**', 'scripts/**']  # 当你修改配置或代码时自动运行

permissions:
  contents: write             # 允许机器人把生成好的HTML自动存回仓库

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install feedparser pyyaml openai
      - name: Build
        env:
          TZ: Asia/Shanghai
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
        run: python scripts/build.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs
          git diff --staged --quiet || git commit -m "chore: update $(date -u +%Y-%m-%dT%H:%M)"
          git pull --rebase origin main
          git push
